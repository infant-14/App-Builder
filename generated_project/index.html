<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorful Todo App</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1 id="todo-title">Colorful Todo App</h1>
    </header>
    <main>
        <input type="text" id="new-todo-input" placeholder="Add a new todo..." />
        <button id="add-todo-button">Add Todo</button>
        <section>
            <ul id="todo-list"></ul>
        </section>
    </main>
</body>
</html>
